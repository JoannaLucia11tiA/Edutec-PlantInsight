<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>
<body>

<div class="container">

    <div class="left">

        <img src="./homemDeVerde.png" class="carinha" alt="ilustração">

        <h2 class="titulo">Login</h2>

        <!-- FORMULÁRIO CORRETO -->
        <form class="form">
            <input type="text" id="email" placeholder="Email">
            <p id="erro-email" class="erro"></p>
            
            <div class="input-senha">
                <input type="password" id="senha" placeholder="Password">
                <img src="./olhofechado.png" id="toggleSenha" class="olho-icon">
            </div>
            <p id="erro-senha" class="erro"></p>

            <button class="btn">Login</button>
        </form>

        <div class="linha-box">
            <div class="linha"></div>
            <a href="../Cadastro/cadastro.html" class="cadastro-link">cadastre-se</a>
            <div class="linha"></div>
        </div>

    </div> 

    <div class="right">
        <img src="./Plantas.png" alt="Plantas">
    </div>

</div>

<div class="logo-ancora">
    <div class="voltar-home-debaixo">
        <a href="/index.html">
            <img src="../Logonavegador.png" alt="Logo do PlantInsight">
        </a>
    </div>
</div>

</body>
</html>
